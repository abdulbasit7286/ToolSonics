<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV ↔ Excel Converter – ToolSonics</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef3ff;
            margin: 0;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d7e1ff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #0038ff;
        }

        .nav-links a {
            margin-left: 18px;
            text-decoration: none;
            font-size: 15px;
            color: #0038ff;
            font-weight: 600;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* TOOL CARD */
        .tool-wrapper {
            max-width: 850px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #d7e1ff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0038ff;
            font-size: 30px;
        }

        /* TABS */
        .tabs {
            display: flex;
            background: #f7f9ff;
            border-radius: 12px;
            border: 1px solid #d7e1ff;
            overflow: hidden;
            margin-top: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 14px;
            cursor: pointer;
            color: #0038ff;
            font-weight: 600;
            transition: 0.25s;
        }

        .tab.active {
            background: #006aff;
            color: white;
        }

        /* UPLOAD BOX */
        .upload-box {
            width: 100%;
            height: 120px;
            border: 2px dashed #6c9bff;
            border-radius: 14px;
            background: #f7f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 25px;
            cursor: pointer;
            transition: .25s;
        }

        .upload-box:hover {
            background: #eaf0ff;
        }

        .upload-box i {
            font-size: 35px;
            color: #0051ff;
        }

        .upload-box span {
            margin-top: 8px;
            font-size: 16px;
            color: #0038ff;
            font-weight: 600;
        }

        input[type="file"] {
            display: none;
        }

        /* BUTTON */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #0059ff, #0038ff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* PROGRESS BAR */
        #progressContainer {
            width: 100%;
            height: 10px;
            background: #dce6ff;
            border-radius: 8px;
            margin-top: 18px;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #0038ff;
            border-radius: 8px;
            transition: width .25s;
        }

        #statusText {
            text-align: center;
            margin-top: 10px;
            color: #444;
        }

        /* FOOTER */
        .footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: white;
            border-top: 1px solid #d7e1ff;
            color: #555;
            font-size: 15px;
        }

        .footer a {
            color: #0038ff;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">ToolSonics</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/tools">Tools</a>
            <a href="/contact">Contact</a>
        </div>
    </div>

    <div class="tool-wrapper">

        <h1>CSV ↔ Excel Converter</h1>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" onclick="showTool('csvToExcel')">CSV → Excel</div>
            <div class="tab" onclick="showTool('excelToCsv')">Excel → CSV</div>
        </div>

        <!-- CSV TO EXCEL -->
        <div id="csvToExcel">
            <label for="csvFile" class="upload-box">
                <i class="fa-solid fa-file-csv"></i>
                <span>Select CSV File</span>
            </label>
            <input type="file" id="csvFile" accept=".csv">

            <button class="btn" onclick="convertCSVtoExcel()">Convert to Excel (XLSX)</button>
        </div>

        <!-- EXCEL TO CSV -->
        <div id="excelToCsv" style="display:none;">
            <label for="excelFile" class="upload-box">
                <i class="fa-solid fa-file-excel"></i>
                <span>Select Excel File</span>
            </label>
            <input type="file" id="excelFile" accept=".xlsx,.xls">

            <button class="btn" onclick="convertExcelToCSV()">Convert to CSV</button>
        </div>

        <!-- PROGRESS -->
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <p id="statusText"></p>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2025 ToolSonics — All Rights Reserved  
        <br><br>
        <a href="/privacy">Privacy Policy</a> |
        <a href="/terms">Terms</a> |
        <a href="/about">About</a>
    </div>

    <script>
        const BACKEND_CSV_TO_EXCEL = "https://api.toolsonics.com/convert/csv-to-excel";
        const BACKEND_EXCEL_TO_CSV = "https://api.toolsonics.com/convert/excel-to-csv";

        function showTool(tool) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".tab")[tool === "csvToExcel" ? 0 : 1].classList.add("active");

            document.getElementById("csvToExcel").style.display = tool === "csvToExcel" ? "block" : "none";
            document.getElementById("excelToCsv").style.display = tool === "excelToCsv" ? "block" : "none";
        }

        function startProgress() {
            progressContainer.style.display = "block";
            progressBar.style.width = "30%";
            statusText.textContent = "Uploading...";
        }

        /* CSV → Excel */
        async function convertCSVtoExcel() {
            const file = csvFile.files[0];
            if (!file) return statusText.textContent = "❗ Please select a CSV file.";

            startProgress();

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch(BACKEND_CSV_TO_EXCEL, { method: "POST", body: form });

                progressBar.style.width = "75%";

                if (!res.ok) return statusText.textContent = "❌ Conversion failed.";

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);

                progressBar.style.width = "100%";
                statusText.textContent = "✔ Downloading Excel file...";

                const a = document.createElement("a");
                a.href = url;
                a.download = "converted.xlsx";
                a.click();

            } catch {
                statusText.textContent = "❌ Network error.";
            }
        }

        /* Excel → CSV */
        async function convertExcelToCSV() {
            const file = excelFile.files[0];
            if (!file) return statusText.textContent = "❗ Please select an Excel file.";

            startProgress();

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch(BACKEND_EXCEL_TO_CSV, { method: "POST", body: form });

                progressBar.style.width = "75%";

                if (!res.ok) return statusText.textContent = "❌ Conversion failed.";

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);

                progressBar.style.width = "100%";
                statusText.textContent = "✔ Downloading CSV file...";

                const a = document.createElement("a");
                a.href = url;
                a.download = "converted.csv";
                a.click();

            } catch {
                statusText.textContent = "❌ Network error.";
            }
        }
    </script>

</body>
</html>
