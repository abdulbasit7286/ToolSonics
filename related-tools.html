<style>
.related-section {

    backdrop-filter: blur(20px);
}

.related-title {
    font-size: 24px;
    color: #ffffff;
    font-weight: 700;
    margin-bottom: 25px;
    text-shadow: 0 0 10px #00c3ff;
}

.related-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
}

.related-card {
    padding: 18px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    transition: 0.3s;
    cursor: pointer;
    text-decoration: none;
}

.related-card:hover {
    transform: translateY(-6px);
    border-color: #00c3ff;
    box-shadow: 0 0 18px #00c3ff;
}

.related-icon {
    font-size: 30px;
    margin-bottom: 12px;
    color: #00c3ff;
}
.related-card h4 {
    font-size: 17px;
    margin-bottom: 4px;
}
.related-card p {
    font-size: 14px;
    opacity: 0.8;
}
</style>
