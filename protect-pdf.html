<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Protect PDF with Password | Encrypt PDF – ToolSonics</title>

    <!-- SEO -->
    <meta name="description" content="Protect your PDF with a secure password online for free. ToolSonics lets you encrypt PDF files instantly without signup. Fast, easy and 100% safe.">
    <meta name="keywords" content="protect pdf, add password pdf, encrypt pdf, lock pdf, secure pdf, toolsonics">

    <meta property="og:title" content="Protect PDF with Password – ToolSonics">
    <meta property="og:description" content="Lock your PDF files with a password online for free. Fast, safe & no signup needed.">
    <meta property="og:image" content="https://abdulbasit7286.github.io/ToolSonics/assets/protect-pdf.png">
    <meta property="og:url" content="https://abdulbasit7286.github.io/ToolSonics/protect-pdf.html">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary:#1a73e8;
            --primary-dark:#0d57c8;
            --bg:#f4f8ff;
            --card:#ffffff;
            --radius:14px;
            --shadow:0 4px 12px rgba(0,0,0,0.08);
            --text:#1a1a1a;
            --light:#555;
        }

        body {
            background:var(--bg);
            margin:0;
            font-family:"Segoe UI",Arial,sans-serif;
            padding:20px;
        }

        .container {
            max-width:850px;
            margin:auto;
            background:var(--card);
            padding:28px;
            border-radius:var(--radius);
            box-shadow:var(--shadow);
        }

        h1 {
            text-align:center;
            color:var(--primary);
            margin-bottom:8px;
        }

        p.subtitle {
            text-align:center;
            color:var(--light);
            margin-top:0;
        }

        #pdfFile { display:none; }

        .file-label {
            display:block;
            background:#e8f0ff;
            border:2px dashed var(--primary);
            text-align:center;
            padding:14px;
            cursor:pointer;
            font-weight:600;
            border-radius:var(--radius);
        }

        .file-info {
            margin-top:6px;
            font-size:14px;
            color:var(--light);
        }

        input[type="password"] {
            width:100%;
            padding:12px;
            margin-top:12px;
            border-radius:var(--radius);
            border:2px solid #dce6ff;
            background:#eef4ff;
        }

        button {
            width:100%;
            background:var(--primary);
            color:white;
            padding:14px;
            border:none;
            border-radius:var(--radius);
            font-size:17px;
            margin-top:18px;
            cursor:pointer;
        }

        button:hover {
            background:var(--primary-dark);
        }

        #progressContainer {
            display:none;
            margin-top:18px;
        }

        #progressBarWrapper {
            width:100%;
            height:12px;
            background:#dbe5ff;
            border-radius:10px;
        }

        #progressBar {
            height:12px;
            width:0%;
            background:var(--primary);
            border-radius:10px;
        }

        #progressText {
            font-size:14px;
            margin-top:4px;
            color:var(--light);
        }

        #statusText {
            margin-top:10px;
            font-size:14px;
            color:var(--light);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Protect PDF with Password</h1>
    <p class="subtitle">Encrypt & lock your PDF files securely – Fast & Free</p>

    <label for="pdfFile" class="file-label">📂 Choose PDF File</label>
    <input type="file" id="pdfFile" accept="application/pdf">
    <div id="fileInfo" class="file-info">No file selected</div>

    <input type="password" id="password" placeholder="Enter password">
    <input type="password" id="confirmPassword" placeholder="Confirm password">

    <button id="protectBtn">Protect PDF</button>
    <div id="statusText"></div>

    <div id="progressContainer">
        <div id="progressBarWrapper">
            <div id="progressBar"></div>
        </div>
        <div id="progressText">0%</div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://toolsonics-backend.onrender.com/pdf/protect";

    const pdfFile = document.getElementById("pdfFile");
    const fileInfo = document.getElementById("fileInfo");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const protectBtn = document.getElementById("protectBtn");

    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const statusText = document.getElementById("statusText");

    pdfFile.addEventListener("change", () => {
        fileInfo.textContent = pdfFile.files.length ? pdfFile.files[0].name : "No file selected";
    });

    protectBtn.addEventListener("click", async () => {
        const file = pdfFile.files[0];
        const pass = password.value.trim();
        const confirm = confirmPassword.value.trim();

        if (!file) {
            statusText.textContent = "Please select a PDF file.";
            return;
        }
        if (!pass || !confirm) {
            statusText.textContent = "Enter and confirm the password.";
            return;
        }
        if (pass !== confirm) {
            statusText.textContent = "Passwords do not match!";
            return;
        }

        // Show progress
        progressContainer.style.display = "block";
        progressBar.style.width = "10%";
        progressText.textContent = "10%";

        let fake = 10;
        const loadInterval = setInterval(() => {
            if (fake < 90) {
                fake += Math.random() * 8;
                fake = Math.min(fake, 90);
                progressBar.style.width = fake + "%";
                progressText.textContent = Math.floor(fake) + "%";
            }
        }, 250);

        const formData = new FormData();
        formData.append("file", file);
        formData.append("password", pass);

        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                body: formData,
            });

            clearInterval(loadInterval);
            progressBar.style.width = "100%";
            progressText.textContent = "100%";

            if (!response.ok) {
                const err = await response.json();
                statusText.textContent = "Error: " + err.error;
                return;
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "protected.pdf";
            a.click();

            statusText.textContent = "PDF protected successfully!";
        } catch (e) {
            statusText.textContent = "Network error. Try again.";
        }
    });
</script>

</body>
</html>
