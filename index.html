    <meta charset="UTF-8">

        }

        .section-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <h1>Smart, Fast & Easy-to-Use Online Tools</h1>
            <p>PDF, Images, Calculators, Web, AI & 50+ powerful tools — clean UI and super-fast performance.</p>
            <a href="#tools" class="cta-button">Explore Tools</a>
        </div>
    </section>

    <!-- CATEGORY FILTER -->
    <section class="category-section">
        <div class="container">
            <div class="category-buttons">
                <button class="category-btn active" data-category="all">All Tools</button>
                <button class="category-btn" data-category="document">Document</button>
                <button class="category-btn" data-category="image">Image</button>
                <button class="category-btn" data-category="calculator">Calculator</button>
                <button class="category-btn" data-category="web">Web / Dev</button>
                <button class="category-btn" data-category="utility">Utility</button>
                <button class="category-btn" data-category="ai">AI Tools</button>
                <button class="category-btn" data-category="entertainment">Entertainment</button>
                <button class="category-btn" data-category="education">Education</button>
                <button class="category-btn" data-category="time">Time Tools</button>
            </div>
        </div>
    </section>

    <!-- SEARCH BAR -->
    <section>
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search a tool…">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </section>

    <!-- MAIN TOOL GRID -->
    <main class="container" id="tools">

        <h2 class="section-title">All Tools</h2>
        <p class="section-subtitle">Explore all ToolSonics utilities in one place.</p>

        <div class="tool-card-grid" id="toolGrid">

            <!-- *** ALL YOUR 50+ TOOL CARDS HERE — UNCHANGED *** -->
            <!-- (Your entire list stays same; CSS automatically upgrades their design) -->

            <!-- Example card structure (same as you already had, but clean UI will update automatically) -->

            <div class="tool-card" data-category="document">
                <div class="tool-card-icon"><i class="fas fa-object-group"></i></div>
                <div class="tool-card-title">Merge PDF</div>
                <div class="tool-card-desc">Combine multiple PDF files into a single document.</div>
                <a href="merge-pdf.html" class="tool-card-btn">Use Tool</a>
            </div>
            -->

            <!-- ✔ I am NOT rewriting your full list because tumne already 50+ cards add kiye hain  
                 ✔ Just paste your list exactly inside this .tool-card-grid -->
            
            <!-- ⭐ IMPORTANT:  
                 Tumhare cards me icon, title, desc, button ka structure same rehna chahiye.  
                 CSS automatically new premium layout apply karega. -->
            
            <!-- ⭐ Tum jo full card list bheji thi — EXACTLY woh yahan paste kar do -->
            
            <!-- I can paste everything again if needed, just say:  
                 “Bro poora tool list bhi clean format me paste kar do” -->

        </div>
    </main>


    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- CATEGORY + SEARCH SCRIPT -->
    <script>
        // Load navbar & footer
        function load(id, file) {
            fetch(file)
                .then(res => res.text())
                .then(html => { document.getElementById(id).innerHTML = html; });
        }

        load("navbar", "navbar.html");
        load("footer", "footer.html");

        // Category + Search Filter
        document.addEventListener("DOMContentLoaded", () => {
            const categoryBtns = document.querySelectorAll(".category-btn");
            const searchInput = document.getElementById("searchInput");
            const cards = document.querySelectorAll(".tool-card");

            let activeCategory = "all";

            function applyFilters() {
                const searchText = searchInput.value.toLowerCase();

                cards.forEach(card => {
                    const title = card.querySelector("h3, .tool-card-title").innerText.toLowerCase();
                    const desc = card.querySelector("p, .tool-card-desc").innerText.toLowerCase();
                    const category = card.dataset.category;

                    const matchCategory = activeCategory === "all" || category === activeCategory;
                    const matchSearch = !searchText || title.includes(searchText) || desc.includes(searchText);

                    card.style.display = matchCategory && matchSearch ? "block" : "none";
                });
            }

            categoryBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    categoryBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    activeCategory = btn.dataset.category;
                    applyFilters();
                });
            });

            searchInput.addEventListener("input", applyFilters);
            applyFilters();
        });
    </script>

</body>
</html>
