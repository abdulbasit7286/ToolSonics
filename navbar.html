<!-- NAVBAR PREMIUM GLASSMORPHISM -->
<style>
.navbar {
    width: 100%;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(25px);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding: 18px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 999;
}

/* Logo */
.nav-logo {
    font-size: 28px;
    font-weight: 800;
    color: #00c3ff;
    text-shadow: 0 0 12px #00c3ff;
}

/* Navigation Links */
.nav-links {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-links a {
    color: white;
    font-size: 16px;
    font-weight: 600;
    transition: 0.3s ease;
}

.nav-links a:hover {
    color: #00c3ff;
    text-shadow: 0 0 8px #00c3ff;
}

/* Mobile Menu */
.menu-btn {
    display: none;
    font-size: 30px;
    color: white;
    cursor: pointer;
}

@media (max-width: 768px) {
    .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        right: 20px;
        top: 70px;
        background: rgba(0, 0, 0, 0.85);
        padding: 20px;
        border-radius: 12px;
        gap: 15px;
        width: 200px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.12);
    }
    .nav-links.show {
        display: flex;
    }
    .menu-btn {
        display: block;
    }
}
</style>

<!-- NAVBAR HTML STRUCTURE -->
<div class="navbar">
    <div class="nav-logo">ToolSonics</div>

    <div class="nav-links" id="navLinks">
       <li><a href="/ToolSonics/index.html#home">Home</a></li>
        <li><a href="/ToolSonics/index.html#tools">Tools</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="privacy-policy.html">Privacy Policy</a></li>
        <li><a href="terms-of-use.html">Terms of Use</a></li>
        <li><a href="contact.html">Contact</a></li>
    </div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("show");
}
</script>
