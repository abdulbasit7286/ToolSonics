<!-- NAVBAR -->
<style>
    .navbar {
        width: 100%;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        padding: 12px 0;
        position: sticky;
        top: 0;
        z-index: 999;
    }

    .nav-container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 24px;
        font-weight: 700;
        color: #1a73e8;
    }
    .logo span { color: #000; }

    nav ul {
        list-style: none;
        display: flex;
        gap: 28px;
        align-items: center;
    }

    nav ul li a {
        text-decoration: none;
        color: #333;
        font-weight: 500;
        font-size: 16px;
        transition: 0.2s;
    }

    nav ul li a:hover {
        color: #1a73e8;
    }

    /* MOBILE MENU */
    .menu-btn {
        display: none;
        font-size: 28px;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        nav ul {
            flex-direction: column;
            background: white;
            width: 100%;
            position: absolute;
            top: 65px;
            left: 0;
            display: none;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        nav ul.show {
            display: flex;
        }

        }

</style>
