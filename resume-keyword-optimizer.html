<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->

    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3907005980307112"
    crossorigin="anonymous"></script>

  <script>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-1H0ZEYLH0K');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Resume ATS Optimizer – Improve ATS Score | ToolSonics</title>
  <meta name="description" content="Free Resume ATS Optimizer by ToolSonics. Match resume with job description, get ATS score, missing keywords & optimization tips.">

  <link rel="icon" href="favicon-16x16.png">
  <link rel="stylesheet" href="global-style.css">
  <link rel="stylesheet" href="navbar.css">

  <style>
    body{
      background:#f5f7fb;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      color:#222948;
    }

    .wrapper{
      max-width:1100px;
      margin:40px auto 60px;
      padding:0 16px;
    }

    .header{
      background:linear-gradient(180deg,#fefeff,#edf3ff);
      border-radius:18px;
      padding:26px;
      border:1px solid #dde5ff;
      box-shadow:0 10px 26px rgba(30,42,90,.06);
      margin-bottom:20px;
    }
    .header h1{margin:0 0 6px;font-size:26px;}
    .header p{margin:0;font-size:14px;color:#5b6684;max-width:700px;}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    @media(max-width:900px){.grid{grid-template-columns:1fr;}}

    .card{
      background:#fff;
      border-radius:16px;
      padding:20px;
      border:1px solid #e0e6ff;
      box-shadow:0 6px 18px rgba(46,61,120,.05);
    }

    .card h2{
      margin:0 0 12px;
      font-size:15px;
      font-weight:900;
    }

    .label{
      font-size:12px;
      font-weight:800;
      color:#44506a;
      margin-bottom:6px;
      display:block;
    }

    .textarea{
      width:100%;
      min-height:180px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid #d3dcff;
      font-size:14px;
      font-weight:600;
      resize:vertical;
      outline:none;
    }
    .textarea:focus{
      border-color:#387bff;
      box-shadow:0 0 0 3px rgba(56,123,255,.15);
    }

    .btn{
      margin-top:14px;
      width:100%;
      border:none;
      border-radius:999px;
      padding:12px 18px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      background:#387bff;
      color:#fff;
      box-shadow:0 8px 18px rgba(56,123,255,.35);
    }
    .btn:hover{background:#2667e5;}

    /* Result */
    .result{
      display:none;
      margin-top:18px;
    }

    .scoreBox{
      text-align:center;
      padding:16px;
      border-radius:16px;
      background:#f7f9ff;
      border:1px solid #dbe3ff;
      margin-bottom:14px;
    }

    .score{
      font-size:38px;
      font-weight:900;
      color:#387bff;
    }
    .scoreBox p{
      margin:6px 0 0;
      font-size:13px;
      color:#5b6684;
      font-weight:700;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .tag{
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid #dbe3ff;
      background:#fff;
    }
    .tag.missing{
      background:#fff5f6;
      border-color:#ffd6db;
      color:#c0392b;
    }
    .tag.matched{
      background:#f0f7ff;
      border-color:#cfe0ff;
      color:#2667e5;
    }

    .tip{
      margin-top:12px;
      font-size:13px;
      color:#44506a;
      background:#f7f9ff;
      border:1px solid #dbe3ff;
      padding:12px;
      border-radius:14px;
      font-weight:700;
    }
  </style>
</head>

<body>

<div id="navbar"></div>

<div class="wrapper">

  <div class="header">
    <h1>Resume ATS Optimizer</h1>
    <p>Check how well your resume matches the job description. Improve ATS score, find missing keywords and optimize for recruiters.</p>
  </div>

  <div class="grid">

    <!-- INPUT -->
    <div class="card">
      <h2>Your Resume</h2>
      <label class="label">Paste Resume Text</label>
      <textarea id="resumeText" class="textarea" placeholder="Paste your resume here..."></textarea>

      <h2 style="margin-top:16px;">Job Description</h2>
      <label class="label">Paste Job Description</label>
      <textarea id="jobText" class="textarea" placeholder="Paste job description here..."></textarea>

      <button class="btn" onclick="analyzeATS()">Analyze ATS Score</button>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <h2>ATS Result</h2>

      <div class="result" id="resultBox">

        <div class="scoreBox">
          <div class="score" id="scoreValue">0%</div>
          <p>ATS Match Score</p>
        </div>

        <h2>Matched Keywords</h2>
        <div class="tags" id="matchedTags"></div>

        <h2 style="margin-top:14px;">Missing Keywords</h2>
        <div class="tags" id="missingTags"></div>

        <div class="tip" id="tipBox"></div>

      </div>
    </div>

  </div>
</div>

<div id="footer"></div>

<script>
  // Navbar + Footer
  function loadComponent(id,file,cb){
    fetch(file).then(r=>r.text()).then(h=>{
      document.getElementById(id).innerHTML=h;
      if(cb)cb();
    });
  }
  function initNavbar(){}
  loadComponent("navbar","navbar.html",initNavbar);
  loadComponent("footer","footer.html");

  // ATS Logic
  function analyzeATS(){
    const resume = document.getElementById("resumeText").value.toLowerCase();
    const job = document.getElementById("jobText").value.toLowerCase();

    if(!resume || !job){
      alert("Please paste both resume and job description.");
      return;
    }

    const clean = txt =>
      [...new Set(
        txt.replace(/[^a-z0-9\s]/g,"")
           .split(/\s+/)
           .filter(w => w.length > 3)
      )];

    const resumeWords = clean(resume);
    const jobWords = clean(job);

    const matched = jobWords.filter(w => resumeWords.includes(w));
    const missing = jobWords.filter(w => !resumeWords.includes(w));

    const score = Math.round((matched.length / jobWords.length) * 100);

    document.getElementById("scoreValue").textContent = score + "%";

    const matchedBox = document.getElementById("matchedTags");
    const missingBox = document.getElementById("missingTags");

    matchedBox.innerHTML = "";
    missingBox.innerHTML = "";

    matched.forEach(w=>{
      const s=document.createElement("span");
      s.className="tag matched";
      s.textContent=w;
      matchedBox.appendChild(s);
    });

    missing.forEach(w=>{
      const s=document.createElement("span");
      s.className="tag missing";
      s.textContent=w;
      missingBox.appendChild(s);
    });

    const tip = document.getElementById("tipBox");
    if(score >= 80){
      tip.textContent = "🔥 Excellent! Your resume is highly ATS-friendly. Minor keyword tweaks can make it perfect.";
    }else if(score >= 60){
      tip.textContent = "👍 Good match. Add missing keywords naturally into skills and experience sections.";
    }else{
      tip.textContent = "⚠️ Low ATS score. Strongly consider adding relevant skills, tools and role-specific keywords.";
    }

    document.getElementById("resultBox").style.display = "block";
  }
</script>

</body>
</html>
