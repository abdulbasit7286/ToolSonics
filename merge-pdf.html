<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Merge PDF Online Free | Fast & Secure PDF Merger – ToolSonics</title>

    <meta name="description"
        content="Merge PDF files online for free using ToolSonics. Fast, secure and easy PDF merger that combines multiple PDF documents into a single file instantly. No signup required. Optimized for global users.">

    <meta property="og:image" content="https://abdulbasit7286.github.io/ToolSonics/assets/merge-pdf.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #eef3ff;
            color: #1a1a1a;
        }

        h1 {
            text-align: center;
            color: #0038ff;
            margin-top: 35px;
            font-size: 30px;
        }

        p.center {
            text-align: center;
            font-size: 15px;
            margin-bottom: 20px;
            color: #555;
        }

        .card {
            max-width: 900px;
            margin: 20px auto;
            background: #ffffff;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
            border: 1px solid #d7e1ff;
        }

        /* SUPER CLEAN SMALL CHOOSE BUTTON */
        .upload-label {
            width: 100%;
            border: 2px dashed #6c9bff;
            background: #f5f8ff;
            padding: 12px 18px;        /* SMALLER HEIGHT */
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            color: #0038ff;
            font-size: 15px;           /* SMALLER TEXT */
            transition: 0.25s;
        }

        .upload-label:hover {
            background: #e7eeff;
            border-color: #2a63ff;
        }

        .upload-label small {
            font-size: 12px; 
            color: #5074cc;
        }

        #pdfFiles {
            display: none;
        }

        /* Main Button */
        .btn {
            background: linear-gradient(to right, #0059ff, #0038ff);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 22px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Progress Bar */
        #progressContainer {
            width: 100%;
            height: 10px;
            background: #dce6ff;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #0038ff;
            border-radius: 8px;
            transition: width 0.25s;
        }

        #statusText {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
            color: #444;
        }
    </style>
</head>

<body>

    <h1>Merge PDF Files Online</h1>
    <p class="center">Fast & Secure PDF Merger – Combine multiple PDFs instantly.</p>

    <div class="card">

        <label for="pdfFiles" class="upload-label">
            📄 Choose PDF Files  
            <br><small>(Select 2 or more PDF files)</small>
        </label>
        <input type="file" id="pdfFiles" accept="application/pdf" multiple>

        <button class="btn" id="mergeBtn">Merge PDFs</button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <p id="statusText"></p>

    </div>

    <script>
        const BACKEND_URL = "https://toolsonics-backend-production.up.railway.app/pdf/merge";

        const fileInput = document.getElementById("pdfFiles");
        const mergeBtn = document.getElementById("mergeBtn");
        const statusText = document.getElementById("statusText");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");

        mergeBtn.addEventListener("click", async () => {
            const files = fileInput.files;
            if (files.length < 2) {
                statusText.textContent = "❗ Please select at least 2 PDF files.";
                return;
            }

            statusText.textContent = "Starting merge...";
            progressContainer.style.display = "block";
            progressBar.style.width = "15%";

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append("files", files[i]);
            }

            try {
                progressBar.style.width = "40%";
                statusText.textContent = "Uploading files...";

                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    body: formData
                });

                progressBar.style.width = "70%";
                statusText.textContent = "Processing...";

                if (!response.ok) {
                    statusText.textContent = "❌ Error merging files!";
                    progressBar.style.width = "0%";
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                progressBar.style.width = "100%";
                statusText.textContent = "✔ Merge complete! Downloading...";

                const a = document.createElement("a");
                a.href = url;
                a.download = "merged.pdf";
                a.click();

            } catch (e) {
                statusText.textContent = "❌ Network error.";
                progressBar.style.width = "0%";
            }
        });
    </script>

</body>

</html>
