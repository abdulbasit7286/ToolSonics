<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF – ToolSonics</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #f5f5f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* TOP NAV LIKE ILOVEPDF */
        .topbar {
            background: #ffffff;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .topbar img {
            height: 45px;
        }

        .topbar a {
            text-decoration: none;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #222;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .upload-box {
            margin-top: 30px;
            padding: 60px;
            border: 2px dashed #ff4444;
            border-radius: 16px;
            background: white;
            transition: 0.25s;
        }

        .upload-box:hover {
            background: #fff7f7;
            border-color: #ff2222;
        }

        .upload-box label {
            padding: 15px 40px;
            background: #ff4444;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
        }

        input[type=file] {
            display: none;
        }

        .primary-btn {
            margin-top: 25px;
            padding: 15px;
            width: 100%;
            border: none;
            background: #ff4444;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .primary-btn:hover {
            background: #e63a3a;
        }

        /* Progress bar */
        #progressContainer {
            margin-top: 20px;
            height: 10px;
            background: #ddd;
            border-radius: 6px;
            display: none;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #ff4444;
            border-radius: 6px;
        }

        #statusText {
            margin-top: 12px;
            color: #444;
        }
    </style>
</head>

<body>

    <!-- TOP ILOVEPDF STYLE HEADER -->
    <div class="topbar">
        <img src="https://cdn.ilovepdf.com/images/ilovepdf.svg" alt="logo">
        <a href="#">MERGE PDF</a>
        <a href="#">SPLIT PDF</a>
        <a href="#">COMPRESS PDF</a>
        <a href="#">CONVERT PDF</a>
        <a href="#">ALL PDF TOOLS</a>
    </div>

    <div class="container">

        <h1>Merge PDF files</h1>
        <p>Combine PDFs in the order you want with the easiest PDF merger available.</p>

        <div class="upload-box">
            <label for="pdfFiles">Select PDF files</label>
            <input type="file" id="pdfFiles" accept="application/pdf" multiple>
            <p style="margin-top:10px;color:#777">or drop PDFs here</p>
        </div>

        <button class="primary-btn" id="mergeBtn">Merge PDFs</button>

        <!-- PROGRESS -->
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <p id="statusText"></p>

    </div>

<script>
const BACKEND_URL = "https://toolsonics-backend-production.up.railway.app/pdf/merge";

const input = document.getElementById("pdfFiles");
const mergeBtn = document.getElementById("mergeBtn");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");
const statusText = document.getElementById("statusText");

mergeBtn.addEventListener("click", async () => {
    const files = input.files;
    if (files.length < 2) {
        statusText.textContent = "❗ Please select at least 2 PDF files.";
        return;
    }

    progressContainer.style.display = "block";
    progressBar.style.width = "25%";
    statusText.textContent = "Uploading files...";

    const formData = new FormData();
    [...files].forEach(f => formData.append("files", f));

    try {
        const response = await fetch(BACKEND_URL, {
            method: "POST",
            body: formData
        });

        progressBar.style.width = "70%";
        statusText.textContent = "Merging PDFs...";

        if (!response.ok) {
            statusText.textContent = "❌ Merge failed.";
            return;
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        progressBar.style.width = "100%";
        statusText.textContent = "✔ Merge complete! Downloading…";

        const a = document.createElement("a");
        a.href = url;
        a.download = "merged.pdf";
        a.click();

    } catch (err) {
        statusText.textContent = "❌ Network error.";
    }
});
</script>

</body>
</html>
