<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy - ToolSonics</title>
<link rel="stylesheet" href="global-style.css">
</head>
<body>

<div id="navbar"></div>

<section class="content-page">
    <div class="container">
        <h1>Privacy Policy</h1>
        <p>
            ToolSonics does not store your files. All processing happens inside your browser
            or through secure temporary processing which auto deletes after conversion.
        </p>

        <p>
            We never sell, store or share your personal information.
            Your privacy and data safety are our first priority.
        </p>
    </div>
</section>

<div id="footer"></div>

<script>
    fetch("navbar.html").then(r=>r.text()).then(d=>navbar.innerHTML=d);
    fetch("footer.html").then(r=>r.text()).then(d=>footer.innerHTML=d);
</script>

</body>
</html>
