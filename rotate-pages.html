<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rotate PDF Pages Online | ToolSonics</title>

    <meta name="description"
        content="Rotate PDF pages online for free with ToolSonics. Rotate any PDF 90°, 180°, or 270° instantly. Fast, secure, mobile-friendly & no signup required.">

    <meta property="og:title" content="Rotate PDF Pages – ToolSonics">
    <meta property="og:image" content="https://abdulbasit7286.github.io/ToolSonics/assets/rotate-pdf.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef3ff;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #0038ff;
            margin-top: 35px;
            font-size: 30px;
            font-weight: bold;
        }

        p.center {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .card {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #d7e1ff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .upload-label {
            width: 100%;
            height: 130px;
            background: #f7f9ff;
            border: 2px dashed #6c9bff;
            border-radius: 14px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            transition: 0.3s;
        }

        .upload-label:hover {
            background: #eaf0ff;
            transform: scale(1.02);
            border-color: #3c6fff;
        }

        .upload-label i {
            font-size: 40px;
            color: #0051ff;
        }

        .upload-label span {
            margin-top: 10px;
            font-size: 17px;
            font-weight: 600;
            color: #0038ff;
        }

        #pdfFile {
            display: none;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border-radius: 8px;
            border: 1px solid #c9d4ff;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #0059ff, #0038ff);
            border: none;
            margin-top: 22px;
            color: #fff;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            opacity: .9;
        }

        #progressContainer {
            width: 100%;
            height: 10px;
            background: #dce6ff;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #0038ff;
            transition: .25s;
            border-radius: 8px;
        }

        #statusText {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #444;
        }
    </style>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <h1>Rotate PDF Pages</h1>
    <p class="center">Rotate PDF 90°, 180°, 270° – Instantly & Free</p>

    <div class="card">

        <label for="pdfFile" class="upload-label">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Select PDF File</span>
        </label>

        <input type="file" id="pdfFile" accept="application/pdf">

        <select id="rotation">
            <option value="90">Rotate 90°</option>
            <option value="180">Rotate 180°</option>
            <option value="270">Rotate 270°</option>
        </select>

        <button id="rotateBtn" class="btn">Rotate PDF</button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <p id="statusText"></p>

    </div>

    <script>

        // ✔ Correct backend endpoint
        const BACKEND_URL = "https://toolsonics-backend-production.up.railway.app/pdf/rotate-pages";

        const pdfInput = document.getElementById("pdfFile");
        const rotationSelect = document.getElementById("rotation");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");
        const statusText = document.getElementById("statusText");

        document.getElementById("rotateBtn").addEventListener("click", async () => {

            const file = pdfInput.files[0];
            const rotation = rotationSelect.value;

            if (!file) {
                statusText.textContent = "❗ Please upload a PDF file.";
                return;
            }

            statusText.textContent = "Starting rotation...";
            progressContainer.style.display = "block";
            progressBar.style.width = "20%";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("rotation", rotation);

            try {
                progressBar.style.width = "55%";
                statusText.textContent = "Uploading file...";

                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    body: formData
                });

                progressBar.style.width = "80%";
                statusText.textContent = "Processing...";

                if (!response.ok) {
                    const err = await response.text();
                    statusText.textContent = "❌ Error: " + err;
                    return;
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                progressBar.style.width = "100%";
                statusText.textContent = "✔ Done! Downloading...";

                const a = document.createElement("a");
                a.href = url;
                a.download = "rotated.pdf";
                a.click();

            } catch (error) {
                statusText.textContent = "❌ Network error.";
            }
        });
    </script>

</body>
</html>
