<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us – ToolSonics</title>
    <link rel="stylesheet" href="global-style.css">
    <link rel="icon" href="favicon-16x16.png">
</head>

<body>

<div id="navbar"></div>

<section class="container" style="margin-top:60px;">

    <h1 style="font-size:34px; font-weight:800; text-shadow:var(--primary-glow);">
        Contact Us
    </h1>

    <p style="margin-top:18px; color:var(--text-light); max-width:800px;">
        Have questions, feedback, or need support?  
        We’re here to help!
    </p>

    <div style="margin-top:30px; padding:20px; border:1px solid var(--border-light); 
                border-radius:var(--radius); background:var(--bg-light); max-width:650px;">
        <p style="color:var(--text-light); line-height:1.8;">
            <b>Email:</b> toolsonics6@gmail<br>
            <b>Response Time:</b> 24/7 <br>
        </p>
    </div>

</section>

<div id="footer"></div>

<script>
    fetch("navbar.html").then(res=>res.text()).then(d=>navbar.innerHTML=d);
    fetch("footer.html").then(res=>res.text()).then(d=>footer.innerHTML=d);
</script>

</body>
</html>
