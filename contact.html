<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1H0ZEYLH0K"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolSonics</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="global-style.css">

    <style>
        .contact-hero {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 90px 20px;
            text-align: center;
            color: white;
        }
        .contact-hero h1 {
            font-size: 2.7rem;
            font-weight: 700;
        }
        .contact-container {
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        .contact-box {
            margin-top: 20px;
        }
        .contact-box h2 {
            color: #1a73e8;
        }
        .contact-details p {
            margin: 10px 0;
            color: #444;
            line-height: 1.6;
        }
        .contact-form {
            margin-top: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 5px rgba(26,115,232,0.2);
        }
        .form-group textarea {
            height: 140px;
            resize: vertical;
        }
        .send-btn {
            padding: 12px 30px;
            border: none;
            background: #1a73e8;
            color: white;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .send-btn:hover {
            background: #0d47a1;
        }
        .note {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div id="navbar"></div>

<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We’re here to help! Reach out anytime.</p>
</section>

<section class="contact-container">

    <div class="contact-box">
        <h2>Get in Touch</h2>
        <div class="contact-details">
            <p><b>Email:</b> toolsonics6@gmail.com</p>
            <p><b>Support Hours:</b> 10:00 AM – 7:00 PM (Mon–Sat)</p>
            <p><b>Response Time:</b> Within 24 hours</p>
        </div>
    </div>

    <div class="contact-form">
        <h2>Send Us a Message</h2>

        <!-- Form UI (Backend optional future) -->
        <form id="contactForm" onsubmit="event.preventDefault(); alert('Message sent! (Demo)');">

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Your Message</label>
                <textarea required placeholder="Write your message..."></textarea>
            </div>

            <button class="send-btn" type="submit">Send Message</button>

            <p class="note">*This is a demo form. Backend will be added later.</p>
        </form>
    </div>

</section>

<div id="footer"></div>

<script>
    fetch("navbar.html").then(r=>r.text()).then(d=>navbar.innerHTML=d);
    fetch("footer.html").then(r=>r.text()).then(d=>footer.innerHTML=d);
</script>

</body>
</html>
