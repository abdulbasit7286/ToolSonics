    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {

            display: grid;

</head>
<body>
    <div class="container">
        <header>
            <h1>Professional Unit Converter</h1>
            <p class="tagline">Convert between various units with precision and ease</p>
        </header>
        
        <div class="converter-container">
            <div class="category-selector">
                <button class="category-btn active" data-category="length">Length</button>
                <button class="category-btn" data-category="weight">Weight</button>
                <button class="category-btn" data-category="temperature">Temperature</button>
                <button class="category-btn" data-category="area">Area</button>
                <button class="category-btn" data-category="volume">Volume</button>
            </div>
            
            <div class="conversion-area">
                <div class="input-group">
                    <label for="from-value">From:</label>
                    <input type="number" id="from-value" value="1" step="any">
                </div>
                
                <button class="swap-btn" id="swap-btn">⇄</button>
                
                <div class="input-group">
                    <label for="to-value">To:</label>
                    <input type="number" id="to-value" readonly>
                </div>
            </div>
            
            <div class="conversion-area">
                <div class="input-group">
                    <label for="from-unit">Unit:</label>
                    <select id="from-unit">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                
                <div></div> <!-- Empty div for grid alignment -->
                
                <div class="input-group">
                    <label for="to-unit">Unit:</label>
                    <select id="to-unit">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
            </div>
            
            <div class="result" id="result">
                1 meter = 100 centimeters
            </div>
            
            <div class="history">
                <h3>Conversion History</h3>
                <div class="history-list" id="history-list">
                    <!-- History items will be added here -->
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Professional Unit Converter &copy; 2023 | Accurate measurement conversion for professionals worldwide</p>
    </footer>

    <script>
        // Conversion factors and units
        const conversionData = {
            length: {
                units: ["meter", "centimeter", "millimeter", "kilometer", "inch", "foot", "yard", "mile"],
                factors: {
                    meter: 1,
                    centimeter: 100,
                    millimeter: 1000,
                    kilometer: 0.001,
                    inch: 39.3701,
                    foot: 3.28084,
                    yard: 1.09361,
                    mile: 0.000621371
                }
            },
            weight: {
                units: ["kilogram", "gram", "milligram", "pound", "ounce"],
                factors: {
                    kilogram: 1,
                    gram: 1000,
                    milligram: 1000000,
                    pound: 2.20462,
                    ounce: 35.274
                }
            },
            temperature: {
                units: ["celsius", "fahrenheit", "kelvin"],
                // Temperature conversion requires special functions
            },
            area: {
                units: ["square meter", "square kilometer", "square foot", "square inch", "acre", "hectare"],
                factors: {
                    "square meter": 1,
                    "square kilometer": 0.000001,
                    "square foot": 10.7639,
                    "square inch": 1550,
                    "acre": 0.000247105,
                    "hectare": 0.0001
                }
            },
            volume: {
                units: ["liter", "milliliter", "cubic meter", "gallon", "quart", "pint"],
                factors: {
                    liter: 1,
                    milliliter: 1000,
                    "cubic meter": 0.001,
                    gallon: 0.264172,
                    quart: 1.05669,
                    pint: 2.11338
                }
            }
        };

        // DOM elements
        const categoryButtons = document.querySelectorAll('.category-btn');
        const fromValueInput = document.getElementById('from-value');
        const toValueInput = document.getElementById('to-value');
        const fromUnitSelect = document.getElementById('from-unit');
        const toUnitSelect = document.getElementById('to-unit');
        const swapButton = document.getElementById('swap-btn');
        const resultDiv = document.getElementById('result');
        const historyList = document.getElementById('history-list');

        // Current category
        let currentCategory = 'length';
        let conversionHistory = [];

        // Initialize the converter
        function initConverter() {
            // Set up category buttons
            categoryButtons.forEach(button => {
                button.addEventListener('click', () => {
                    categoryButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    currentCategory = button.getAttribute('data-category');
                    updateUnitOptions();
                    convert();
                });
            });

            // Set up input events
            fromValueInput.addEventListener('input', convert);
            fromUnitSelect.addEventListener('change', convert);
            toUnitSelect.addEventListener('change', convert);

            // Set up swap button
            swapButton.addEventListener('click', swapUnits);

            // Initialize unit options
            updateUnitOptions();
            
            // Perform initial conversion
            convert();
        }

        // Update unit options based on current category
        function updateUnitOptions() {
            const units = conversionData[currentCategory].units;
            
            // Clear existing options
            fromUnitSelect.innerHTML = '';
            toUnitSelect.innerHTML = '';
            
            // Add new options
            units.forEach(unit => {
                const fromOption = document.createElement('option');
                fromOption.value = unit;
                fromOption.textContent = unit;
                fromUnitSelect.appendChild(fromOption);
                
                const toOption = document.createElement('option');
                toOption.value = unit;
                toOption.textContent = unit;
                toUnitSelect.appendChild(toOption);
            });
            
            // Set default selections
            if (currentCategory === 'length') {
                fromUnitSelect.value = 'meter';
                toUnitSelect.value = 'centimeter';
            } else if (currentCategory === 'weight') {
                fromUnitSelect.value = 'kilogram';
                toUnitSelect.value = 'gram';
            } else if (currentCategory === 'temperature') {
                fromUnitSelect.value = 'celsius';
                toUnitSelect.value = 'fahrenheit';
            } else if (currentCategory === 'area') {
                fromUnitSelect.value = 'square meter';
                toUnitSelect.value = 'square foot';
            } else if (currentCategory === 'volume') {
                fromUnitSelect.value = 'liter';
                toUnitSelect.value = 'gallon';
            }
        }

        // Perform conversion
        function convert() {
            const fromValue = parseFloat(fromValueInput.value) || 0;
            const fromUnit = fromUnitSelect.value;
            const toUnit = toUnitSelect.value;
            
            let result;
            
            if (currentCategory === 'temperature') {
                result = convertTemperature(fromValue, fromUnit, toUnit);
            } else {
                // For other categories, use conversion factors
                const fromFactor = conversionData[currentCategory].factors[fromUnit];
                const toFactor = conversionData[currentCategory].factors[toUnit];
                result = fromValue * (toFactor / fromFactor);
            }
            
            // Update the result field
            toValueInput.value = result.toFixed(6);
            
            // Update the result display
            resultDiv.textContent = `${fromValue} ${fromUnit} = ${result.toFixed(6)} ${toUnit}`;
            
            // Add to history
            addToHistory(fromValue, fromUnit, result, toUnit);
        }

        // Temperature conversion (special case)
        function convertTemperature(value, fromUnit, toUnit) {
            if (fromUnit === toUnit) return value;
            
            // Convert to Celsius first
            let celsius;
            if (fromUnit === 'celsius') {
                celsius = value;
            } else if (fromUnit === 'fahrenheit') {
                celsius = (value - 32) * 5/9;
            } else if (fromUnit === 'kelvin') {
                celsius = value - 273.15;
            }
            
            // Convert from Celsius to target unit
            if (toUnit === 'celsius') {
                return celsius;
            } else if (toUnit === 'fahrenheit') {
                return (celsius * 9/5) + 32;
            } else if (toUnit === 'kelvin') {
                return celsius + 273.15;
            }
        }

        // Swap units
        function swapUnits() {
            const tempUnit = fromUnitSelect.value;
            fromUnitSelect.value = toUnitSelect.value;
            toUnitSelect.value = tempUnit;
            convert();
        }

        // Add conversion to history
        function addToHistory(fromValue, fromUnit, toValue, toUnit) {
            const historyItem = {
                fromValue,
                fromUnit,
                toValue,
                toUnit,
                timestamp: new Date().toLocaleTimeString()
            };
            
            conversionHistory.unshift(historyItem);
            
            // Keep only last 5 items
            if (conversionHistory.length > 5) {
                conversionHistory.pop();
            }
            
            updateHistoryDisplay();
        }

        // Update history display
        function updateHistoryDisplay() {
            historyList.innerHTML = '';
            
            conversionHistory.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = `${item.fromValue} ${item.fromUnit} → ${item.toValue.toFixed(4)} ${item.toUnit} (${item.timestamp})`;
                historyList.appendChild(historyItem);
            });
        }

        // Initialize the converter when the page loads
        window.addEventListener('DOMContentLoaded', initConverter);
    </script>
</body>
</html>
